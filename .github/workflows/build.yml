name: Build ImmortalWrt for TP-Link WMA301-V2

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: write

env:
  CONFIG_FILE: .config
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
          python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          unzip upx-ucl vim wget xmlto xxd zlib1g-dev

    - name: Clone source code
      run: |
        git clone --depth 1 https://github.com/zeromake/immortalwrt-mt798x-6.6.git immortalwrt
        cd immortalwrt
        git_log=$(git log --oneline -1)
        echo "Source commit: $git_log"

    - name: Load custom config
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE immortalwrt/.config
        
    - name: Fix EEE and change LAN IP
      run: |
        cd immortalwrt
        mkdir -p files/etc/uci-defaults
        cat > files/etc/uci-defaults/99-fix-network << 'OFFEOF'
        #!/bin/sh
        for dev in /sys/class/net/*; do
          n=$(basename "$dev")
          case "$n" in
            eth*|lan*|wan*|switch*) ethtool --set-eee "$n" eee off 2>/dev/null ;;
          esac
        done
        uci set network.lan.ipaddr='192.168.100.1'
        uci commit network
        exit 0
        OFFEOF
        chmod +x files/etc/uci-defaults/99-fix-network

    - name: Update feeds
      run: |
        cd immortalwrt
        sed -i 's/https:\/\/git.openwrt.org/https:\/\/github.com\/openwrt/g' feeds.conf.default
        sed -i 's/https:\/\/git.openwrt.org\/project/https:\/\/github.com\/openwrt/g' feeds.conf.default
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages" >> feeds.conf.default
        echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config
      run: |
        cd immortalwrt
        make defconfig

    - name: Enable PassWall and verify
      run: |
        cd immortalwrt
        cat >> .config << 'CFGEOF'
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
        CONFIG_PACKAGE_xray-core=y
        CFGEOF
        make defconfig
        echo "=== PassWall symbols in final .config ==="
        grep -E "passwall|xray" .config || true
        if ! grep -q "^CONFIG_PACKAGE_luci-app-passwall=y" .config; then
          echo "ERROR: luci-app-passwall missing - dependencies unresolved"
          exit 1
        fi
        echo "PassWall OK"

    - name: Show build config
      run: |
        cd immortalwrt
        grep -E "^CONFIG_TARGET" .config || true
        echo "---"
        grep "WMA301" .config || true

    - name: Download packages
      run: |
        cd immortalwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile firmware
      run: |
        cd immortalwrt
        echo "Compiling with $(nproc) threads..."
        make -j$(nproc)
        echo "Build completed!"
        find bin/targets/ -name "*.bin" -o -name "*.itb" | head -20

    - name: Organize output files
      id: organize
      run: |
        cd immortalwrt
        FIRMWARE_DIR="${GITHUB_WORKSPACE}/firmware"
        mkdir -p "$FIRMWARE_DIR"
        # Copy all firmware images
        find bin/targets/ -name "*.bin" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "*.itb" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "*.img.gz" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "sha256sums" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "config.buildinfo" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "feeds.buildinfo" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "version.buildinfo" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        # Also copy preloader and uboot if exists (for ubootmod variant)
        find bin/targets/ -name "preloader.bin" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        find bin/targets/ -name "bl31-uboot.fip" -exec cp {} "$FIRMWARE_DIR/" \; 2>/dev/null || true
        echo "=== Firmware files ==="
        ls -lh "$FIRMWARE_DIR/"
        echo "firmware_dir=$FIRMWARE_DIR" >> $GITHUB_OUTPUT

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_ARTIFACT == 'true'
      with:
        name: WMA301-V2-firmware-${{ github.run_number }}
        path: firmware/
        retention-days: 30

    - name: Generate release info
      id: release_info
      run: |
        SOURCE_COMMIT=$(cd immortalwrt && git rev-parse --short HEAD)
        BUILD_DATE=$(date +"%Y%m%d")
        TAG_NAME="v${BUILD_DATE}-${SOURCE_COMMIT}"
        RELEASE_TITLE="WMA301-V2 ${BUILD_DATE} (${SOURCE_COMMIT})"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
        echo "source_commit=$SOURCE_COMMIT" >> $GITHUB_OUTPUT

    - name: Upload firmware to Release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.release_title }}
        body: |
          ## TP-Link WMA301-V2 ImmortalWrt 固件

          - **构建日期**: ${{ steps.release_info.outputs.release_title }}
          - **源码**: [immortalwrt-mt798x-6.6](https://github.com/zeromake/immortalwrt-mt798x-6.6.git)
          - **源码 Commit**: `${{ steps.release_info.outputs.source_commit }}`
          - **设备**: TP-Link WMA301-V2 (MT7981, filogic)
          - **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        files: firmware/*
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

